function bearing(a, b, c, d){ const y = Math.sin((d-b)*R)*Math.cos(c*R);
  const x = Math.cos(a*R)*Math.sin(c*R) - Math.sin(a*R)*Math.cos(c*R)*Math.cos((d-b)*R);
  return (Math.atan2(y, x)/R + 360) % 360; }
function dirSpeed(deg){ return SP*(0.2 + 0.8*Math.max(Math.cos((deg-DR)*R), 0)); }

// ---- 기상청 격자 변환 (Lambert) ----
function llToGrid(lat, lon){
  const RE=6371.00877, GRID=5.0, SLAT1=30.0, SLAT2=60.0, OLON=126.0, OLAT=38.0, XO=43, YO=136;
  const re=RE/GRID, s1=SLAT1*R, s2=SLAT2*R, olon=OLON*R, olat=OLAT*R;
  let sn=Math.tan(Math.PI*0.25+s2*0.5)/Math.tan(Math.PI*0.25+s1*0.5);
  sn=Math.log(Math.cos(s1)/Math.cos(s2))/Math.log(sn);
  let sf=Math.pow(Math.tan(Math.PI*0.25+s1*0.5), sn)*Math.cos(s1)/sn;
  const ro=re*sf/Math.pow(Math.tan(Math.PI*0.25+olat*0.5), sn);
  const ra=re*sf/Math.pow(Math.tan(Math.PI*0.25+lat*R*0.5), sn);
  let th=lon*R-olon; if(th>Math.PI) th-=2*Math.PI; if(th<-Math.PI) th+=2*Math.PI; th*=sn;
  return {nx: Math.floor(ra*Math.sin(th)+XO+0.5), ny: Math.floor(ro-ra*Math.cos(th)+YO+0.5)};
}
// 초단기실황은 매시 40분 이후 발표 → 40분 전 시각의 정시 사용 (자정 넘김도 처리)
function baseDT(){
  const t = new Date(Date.now() - 40*60000), p = n => String(n).padStart(2, '0');
  return {d: '' + t.getFullYear() + p(t.getMonth()+1) + p(t.getDate()), t: p(t.getHours()) + '00'};
}
async function getWeather(lat, lon){
  if (!D.kma) throw new Error('기상청 키 없음');
  const g = llToGrid(lat, lon), b = baseDT();
  const url = 'https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst'
            + '?serviceKey=' + encodeURIComponent(D.kma) + '&pageNo=1&numOfRows=20&dataType=JSON'
            + '&base_date=' + b.d + '&base_time=' + b.t + '&nx=' + g.nx + '&ny=' + g.ny;
  const r = await fetch(url);
  const j = await r.json();
  const items = j?.response?.body?.items?.item;
  if (!items) throw new Error(j?.response?.header?.resultMsg || '데이터 없음');
  const W = {}; items.forEach(it => W[it.category] = it.obsrValue);
  return {W: W, src: `기상청 실황 ${b.d.slice(4,6)}/${b.d.slice(6)} ${b.t.slice(0,2)}시 (격자 ${g.nx},${g.ny})`};
}
// 간단한 교육용 확산 모델: 풍속↑ 빨라짐, 습도↓ 빨라짐, 비 오면 느려짐, 바람이 불어가는 쪽으로 확산
function spreadFrom(W){
  const ws = parseFloat(W.WSD) || 0, reh = parseFloat(W.REH), rn = parseFloat(W.RN1) || 0, vec = parseFloat(W.VEC);
  const fh = isNaN(reh) ? 1 : reh < 30 ? 1.5 : reh < 50 ? 1.0 : 0.6;
  return {speed: (0.5 + 0.4*ws) * fh * (rn > 0 ? 0.3 : 1),
          dir: isNaN(vec) ? D.dir : (vec + 180) % 360};
}

let map, iw, layer = [], timer = null, CUR = null, seq = 0;
function dot(color, scale){ return {path: google.maps.SymbolPath.CIRCLE, scale: scale, fillColor: color,
                                    fillOpacity: .9, strokeColor: '#fff', strokeWeight: 1}; }
function clearLayer(){ layer.forEach(o => o.setMap(null)); layer = []; }

window.gm_authFailure = () => alert('Google Maps 키 오류: Maps JavaScript API 사용 설정과 웹사이트 제한을 확인하세요.');

window.initMap = function(){
  map = new google.maps.Map(document.getElementById('map'), {
    center: {lat: D.lat0, lng: D.lon0}, zoom: 12, mapTypeId: 'hybrid',
    streetViewControl: false, fullscreenControl: false, clickableIcons: false,
    mapTypeControlOptions: {position: google.maps.ControlPosition.BOTTOM_LEFT}
  });
  iw = new google.maps.InfoWindow();
  map.addListener('click', e => startFire(e.latLng.lat(), e.latLng.lng()));
};

function nearSchools(lat, lon){
  const dLat = D.radius/111, dLon = D.radius/(111*Math.cos(lat*R)), out = [];
  for (const [n, a, o] of D.schools){
    if (Math.abs(a-lat) > dLat || Math.abs(o-lon) > dLon) continue;
    const d = dist(lat, lon, a, o);
    if (d <= D.radius) out.push({name: n, lat: a, lon: o, d: d});
  }
  return out;
}

async function startFire(lat, lon){
  const my = ++seq;
  clearLayer(); clearInterval(timer); iw.close();
  document.getElementById('ai-out').textContent = '';
  document.getElementById('info').innerHTML = '🌬️ 클릭 위치 기상청 실황 조회 중...';

  // 1) 클릭 위치 기상 조회 (실패 시 노트북 값)
  let W, src;
  try { const r = await getWeather(lat, lon); W = r.W; src = r.src;
        const s = spreadFrom(W); SP = s.speed; DR = s.dir; }
  catch(e){ W = D.weather; SP = D.speed; DR = D.dir;
            src = '⚠️ 노트북 값(고정) - API 실패: ' + esc(e.message); }
  if (my !== seq) return;           // 조회 중에 다른 곳을 클릭했으면 이 결과는 버림

  const c = {lat: lat, lng: lon};
  layer.push(new google.maps.Marker({position: c, map: map, zIndex: 999, title: '발화지점',
    icon: dot('#ef4444', 14), label: {text: '🔥', fontSize: '20px'}}));
  layer.push(new google.maps.Circle({center: c, radius: D.radius*1000, map: map, clickable: false,
    strokeColor: '#3b82f6', strokeWeight: 2, fillOpacity: 0}));
  const arrow = new google.maps.Polyline({path: [c, move(lat, lon, SP*60*6/1000, DR)], map: map,
    strokeColor: '#ffffff', strokeWeight: 4, clickable: false,
    icons: [{icon: {path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale: 5, strokeColor: '#fff',
                    fillColor: '#fff', fillOpacity: 1}, offset: '100%'},
            {icon: {path: google.maps.SymbolPath.CIRCLE, scale: 6, fillColor: 'red', fillOpacity: 1,
                    strokeColor: '#fff', strokeWeight: 2}, offset: '0%'}]});
  layer.push(arrow);

  // 2) 반경 내 학교 위험등급
  const res = [];
  nearSchools(lat, lon).forEach(s => {
    const hrs = s.d*1000/dirSpeed(bearing(lat, lon, s.lat, s.lon))/60;
    const g = hrs <= 1 ? '심각' : hrs <= 3 ? '경계' : hrs <= 6 ? '주의' : '관심';
    const m = new google.maps.Marker({position: {lat: s.lat, lng: s.lon}, map: map,
                                      icon: dot(COLORS[g], 7), title: s.name});
    const html = `<b>${esc(s.name)}</b><br>거리 ${s.d.toFixed(2)}km<br>도달 약 ${hrs.toFixed(1)}시간<br>등급: ${g}`;
    m.addListener('click', () => { iw.setContent('<div style="color:#000;font-size:12px">' + html + '</div>'); iw.open(map, m); });
    layer.push(m);
    res.push({이름: s.name, 거리_km: +s.d.toFixed(2), 도달_시간: +hrs.toFixed(1), 등급: g});
  });
  res.sort((a, b) => a.도달_시간 - b.도달_시간);
  const cnt = {심각:0, 경계:0, 주의:0, 관심:0}; res.forEach(r => cnt[r.등급]++);
  const wx = {풍속_ms: W.WSD, 풍향_도: W.VEC, 습도: W.REH, 기온: W.T1H, 강수_mm: W.RN1, 출처: src};
  CUR = {산불_위치: {위도: +lat.toFixed(5), 경도: +lon.toFixed(5)}, 기상: wx,
         확산: {속도_m분: +SP.toFixed(2), 방향: dirName(DR),
                "1시간_km": +(SP*60/1000).toFixed(2), "3시간_km": +(SP*180/1000).toFixed(2),
                "6시간_km": +(SP*360/1000).toFixed(2)},
         학교: {분석반경_km: D.radius, 등급별: cnt, 상위10: res.slice(0, 10)},
         경기도_산불대응장비: D.equip};

  document.getElementById('info').innerHTML =
    `<b>🔥 산불 분석</b> <span style="color:#888">(다시 클릭하면 위치 변경)</span><br>
     위치: ${lat.toFixed(4)}, ${lon.toFixed(4)}<br>
     <span style="color:#555;font-size:11px">${src}</span><br>
     풍속 <b>${W.WSD}m/s</b> · 풍향 ${W.VEC}° · 습도 <b>${W.REH}%</b> · 기온 ${W.T1H}℃ · 강수 ${W.RN1}mm<br>
     확산 속도 <b>${SP.toFixed(2)} m/분</b> (${(SP*0.06).toFixed(2)} km/h) · 방향 ${dirName(DR)}<hr>
     반경 ${D.radius}km 학교 <b>${res.length}곳</b><br>
     <span style="color:red">●심각 ${cnt.심각}</span> <span style="color:orange">●경계 ${cnt.경계}</span>
     <span style="color:#c9a000">●주의 ${cnt.주의}</span> <span style="color:green">●관심 ${cnt.관심}</span><br>
     ${res.slice(0, 5).map(r => `· ${esc(r.이름)} (${r.도달_시간}h, ${r.등급})`).join('<br>') || '반경 내 학교 없음'}<hr>
     <b>경기도 산불 대응 장비 TOP3</b><br>
     ${D.equip.slice(0, 3).map(e => `· ${esc(e.name)}: ${e.qty}`).join('<br>') || '-'}`;

  // 3) 6시간 확산 애니메이션
  const poly = new google.maps.Polygon({map: map, strokeWeight: 2, clickable: false});
  layer.push(poly);
  let i = 0;
  timer = setInterval(() => {
    i = i % 36 + 1; const h = i/6;
    const col = h <= 1 ? 'red' : h <= 3 ? 'orange' : 'yellow';
    const ring = []; for (let d = 0; d < 360; d += 10) ring.push(move(lat, lon, dirSpeed(d)*60*h/1000, d));
    poly.setOptions({paths: ring, strokeColor: col, fillColor: col, fillOpacity: .3});
    const ic = arrow.get('icons'); ic[1].offset = (i/36*100) + '%'; arrow.set('icons', ic);
    document.getElementById('clock').textContent =
      `발화 후 ${Math.floor(h)}시간 ${String(Math.round((h%1)*60)).padStart(2, '0')}분`;
  }, 400);
}

async function askClaude(){
  const out = document.getElementById('ai-out'), btn = document.getElementById('ai-btn');
  if (!CUR){ out.textContent = '먼저 지도를 클릭해 산불 위치를 정하세요.'; return; }
  btn.disabled = true; out.textContent = '분석 중... (10~30초)';
  const prompt = "다음 산불 상황 데이터를 분석해 주세요.\n" + JSON.stringify(CUR, null, 1);
  try {
    const res = await fetch(D.worker + '/v1/messages?base=' + encodeURIComponent(D.base), {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + D.key,
                'anthropic-version': '2023-06-01'},
      body: JSON.stringify({model: D.model, max_tokens: 1500, system: D.system,
                            messages: [{role: 'user', content: prompt}]})});
    if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0, 200));
    const d = await res.json();
    const text = (d.content && d.content[0] && d.content[0].text)
              || (d.choices && d.choices[0].message.content) || JSON.stringify(d);
    out.innerHTML = esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  } catch(e){ out.textContent = '오류: ' + e.message; }
  btn.disabled = false;
}

const gs = document.createElement('script');
gs.src = 'https://maps.googleapis.com/maps/api/js?key=' + D.gmap + '&callback=initMap&language=ko&region=KR&loading=async';
gs.async = true;
document.head.appendChild(gs);
</script></body></html>
